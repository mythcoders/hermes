default: &default
  store_options: &default_store_options
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 90.days.to_i %>
    namespace: <%= Rails.env %>
  size_estimate_samples: 1000

development:
  database: cache
  store_options:
    <<: *default_store_options
    max_size: <%= 10.gigabytes %>

production: &production
  database: cache
  store_options:
    <<: *default_store_options
    max_entries: <%= 5.gigabytes %>
